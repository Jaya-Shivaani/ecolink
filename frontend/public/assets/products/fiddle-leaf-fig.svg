<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)" />
  
  <!-- Soft Radial Glow -->
  <circle cx="300" cy="240" r="180" fill="#86efac" opacity="0.15" />

  <!-- Botanical Emblem & Pot Illustration -->
  <g filter="url(#shadow)" transform="translate(0, -20)">
    <!-- Terracotta / Eco Pot -->
    <path d="M220 370 L380 370 L360 460 L240 460 Z" fill="#b45309" opacity="0.9" />
    <rect x="210" y="350" width="180" height="24" rx="6" fill="#d97706" />

    <!-- Stems and Leaves -->
    <path d="M300 350 Q300 240 250 160" stroke="#86efac" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M300 320 Q320 220 360 180" stroke="#86efac" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Central Leaf Shapes -->
    <path d="M250 160 Q210 200 250 240 Q290 200 250 160 Z" fill="url(#leafGrad)"/>
    <path d="M360 180 Q320 220 360 260 Q400 220 360 180 Z" fill="url(#leafGrad)"/>
    <path d="M300 200 Q260 140 300 90 Q340 140 300 200 Z" fill="#86efac"/>
  </g>

  <!-- Product Badge Pill -->
  <rect x="40" y="40" width="220" height="42" rx="21" fill="#ffffff" opacity="0.12" />
  <text x="56" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">🌱 ECOLINK LOCAL</text>

  <!-- Product Title & Category Overlay -->
  <rect x="36" y="475" width="528" height="88" rx="20" fill="#064e3b" opacity="0.85" stroke="#86efac" stroke-width="1.5"/>
  <text x="60" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Fiddle Leaf Fig</text>
  <text x="60" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#86efac">INDOOR PLANTS</text>
</svg>